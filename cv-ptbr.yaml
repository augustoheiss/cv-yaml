projects:
  - name: "LogicDefense CV RAG Engine (Heiss-Lab)"
    description: "Arquitetura avançada em FastAPI para geração dinâmica de currículos, separando completamente o conteúdo (YAML) da apresentação visual."
    highlights:
      - "Identificou e resolveu problemas de limite de tokens da API do Gemini 2.5 Flash através da implementação de processamento paralelo concorrente (asyncio.gather)."
      - "Reduziu drasticamente o tempo de resposta do servidor, disparando 4 pedidos simultâneos para forjar múltiplos arquétipos numa única execução."
    url: "https://heiss-lab.vercel.app/laboratorio/cv-maker"

  - name: "Assistente Escola Modelo (Automação RAG/Playwright)"
    description: "Sistema de IA criado para libertar o corpo docente da burocracia, utilizando a ética do 'Segundo Atual'."
    highlights:
      - "Forjou um 'Escudo RAG', obrigando a IA a consultar apenas documentos oficiais antes de gerar respostas, garantindo transparência técnica e zero alucinações."
      - "Integrou protocolos 'Human-in-the-loop' para supervisão, com estrutura planeada para acionamento de APIs e execução RPA no Sistema de Gestão Pedagógica."
    url: "https://assistente-escola-modelo.streamlit.app/"

  - name: "Assistente-Moeda (Dashboard Financeiro Automotivo)"
    description: "Ferramenta preditiva que transforma dados estáticos em dinâmicos para assegurar a função mecânica do capital."
    highlights:
      - "Desenvolveu cálculos para fracionar metas diárias e projetar rendimentos no Tesouro Direto num horizonte de 3 anos."
      - "Otimizou a alocação de recursos, cobrindo os custos de rodagem de um veículo híbrido através da rentabilidade projetada."

  - name: "Ecossistema de Jogos WebGL (Godot)"
    description: "Museu vivo de videojogos Web (LogicDefense e LogicAscension) elaborados em cocriação com IA."
    highlights:
      - "Demonstrou rapidez de aprendizagem ao aplicar sistemas vetoriais e lógicos operando sob restrições estritas de tempo diretamente no motor Godot."

  - name: "Alavanca Tecnológica para Autônomos"
    description: "Aceleração de negócios locais através da programação."
    highlights:
      - "Desenvolveu e efetuou o deploy (Vercel/GitHub Pages) de múltiplas páginas de alta conversão para profissionais de idiomas, estética, climatização e transporte executivo."

