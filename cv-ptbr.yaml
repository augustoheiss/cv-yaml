projects:
  - name: "LogicDefense CV RAG Engine"
    description: "API backend baseada em FastAPI para geração dinâmica de currículos, separando estruturalmente os dados em YAML da camada de apresentação visual."
    highlights:
      - "Identificação e resolução de gargalos de limite de requisições na API do Gemini 2.5 Flash através da implementação de processamento assíncrono concorrente (asyncio.gather do Python)."
      - "Redução significativa da latência de resposta do servidor executando múltiplas requisições simultâneas em um único event loop."
    url: "https://heisslab.com.br/laboratorio/cv-maker"

  - name: "Assistente Escola Modelo (Automação com IA/RPA)"
    description: "Assistente administrativo com inteligência artificial desenvolvido para automatizar fluxos de trabalho de dados pedagógicos."
    highlights:
      - "Implementação de arquitetura RAG com guardrails estritos de prompt, restringindo o contexto da LLM a documentos oficiais para mitigar alucinações de forma eficaz."
      - "Integração do Playwright para Automação de Processos Robóticos (RPA), automatizando a inserção de dados diretamente no Sistema de Gestão Escolar com protocolos de verificação 'Human-in-the-loop'."
    url: "https://assistente-escola-modelo.streamlit.app/"

  - name: "Assistente-Moeda (Dashboard Financeiro)"
    description: "Dashboard de dados preditivos para acompanhamento de retornos financeiros e otimização de recursos."
    highlights:
      - "Desenvolvimento de scripts em Python utilizando Pandas para calcular metas de rendimento diário e projetar retornos do Tesouro Direto em um horizonte de 3 anos."
      - "Criação de visualizações de dados para balancear dinamicamente os custos operacionais de um veículo híbrido contra a rentabilidade projetada."
    url: "https://www.heisslab.com.br/laboratorio/assistente-moeda"

  - name: "WebGL Interactive Logic Games"
    description: "Aplicações web interativas baseadas em lógica com foco na resolução de problemas algorítmicos."
    highlights:
      - "Desenvolvimento de aplicações interativas para navegador utilizando a Godot Engine, aplicando matemática vetorial, gerenciamento de estado e lógica algorítmica sob restrições estritas."
    url: "https://www.heisslab.com.br/jogos"

