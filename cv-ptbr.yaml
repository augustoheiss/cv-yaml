projects:
  - name: LogicDefense CV RAG Engine
    description: API corporativa de geração e compilação dinâmica de documentos estruturados baseada em FastAPI, RAG e modelos generativos.
    highlights:
      - Otimizou o throughput do sistema eliminando gargalos de rate-limit da API do Gemini 3.7 Flash (High Thinking) via execução concorrente assíncrona com asyncio.gather em um único event loop.
      - Reduziu a latência ao desacoplar esquemas YAML padronizados da camada de renderização visual standalone.
    keywords:
      - Python
      - FastAPI
      - Asyncio
      - Gemini 3.7 Flash
      - RAG
      - Render
    url: https://heisslab.com.br/laboratorio/cv-maker
  - name: Assistente Escola Modelo (Enterprise RAG & RPA)
    description: Suíte de automação inteligente para processos administrativos e pedagógicos com IA generativa e orquestração de browsers.
    highlights:
      - Implementou pipeline RAG com guardrails rígidos de prompt, mitigando alucinações de LLMs a níveis corporativos.
      - Automatizou fluxos em sistemas legados via Playwright (RPA) sob arquitetura Human-in-the-Loop auditável.
    keywords:
      - Python
      - RAG
      - Playwright
      - RPA
      - Streamlit
      - Governança de IA
    url: https://assistente-escola-modelo.streamlit.app/
  - name: Assistente-Moeda (Dashboard Financeiro Local-First)
    description: Motor analítico e preditivo financeiro baseado em arquitetura stateless e persistência Local-First com SQLite/Turso.
    highlights:
      - Projetou algoritmos determinísticos para simulação e projeção de títulos públicos do Tesouro Direto em horizontes plurianuais.
      - Estruturou arquitetura Local-First com Turso DB e Pandas, garantindo soberania de dados e zero desperdício de tokens de API.
    keywords:
      - Python
      - APIs REST
      - Pandas
      - Turso SQLite
      - Local-First
      - Finanças
    url: https://www.heisslab.com.br/laboratorio/assistente-moeda
  - name: WebGL Interactive Logic Engines
    description: Motores web de alta performance para execução de lógica algorítmica e matemática vetorial sob restrições de tempo real.
    highlights:
      - Desenvolveu mecânicas interativas em Godot Engine e WebGL, aplicando controle estrito de estado e física vetorial.
