  summary: 'Engenheiro de Software e Arquiteto Backend com sólida base matemática,
    especializado no desenvolvimento de microsserviços assíncronos de alto rendimento
    (FastAPI), motores corporativos de RAG e automações resilientes com Playwright.
    Atua no ecossistema IBM de Nuvem Híbrida e IA com foco em integrações empresariais
    robustas, governança e conformidade técnica.


    Combina mais de sete anos de rigor analítico e decomposição modular de problemas
    com padrões contemporâneos de arquitetura Local-First e microsserviços stateless.
    Especialista em assegurar soberania de dados, mitigação estrita de alucinações
    em Large Language Models (LLMs) e desacoplamento de camadas de alta concorrência.


    Focado em traduzir metas estratégicas de negócio em arquiteturas de software sustentáveis
    e escaláveis, promovendo excelência operacional e colaboração em equipes de engenharia
    de alta performance sob princípios ágeis de nível Enterprise.'
