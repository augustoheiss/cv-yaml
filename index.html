<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo yaml</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link rel="stylesheet" href="themes.css">

    <style>
        /* ======== PRINT: Hack da Tabela Fantasma + Layout Otimizado ======== */
        @media print {

            html,
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #0f172a !important;
                margin: 0 !important;
                padding: 0 !important;
                height: 100% !important;
                font-size: 10.5pt !important;
            }

            @page {
                size: A4;
                margin: 0 !important;
            }

            /* Ativa o cabeçalho/rodapé fantasma da tabela apenas na impressão */
            .print-header {
                display: table-header-group !important;
            }

            .print-footer {
                display: table-footer-group !important;
            }

            /* Evita corte no meio de caixas */
            .evitar-quebra {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Esconde elementos indesejados */
            ::-webkit-scrollbar {
                display: none;
            }

            .print\:hidden {
                display: none !important;
            }

            /* Reset de fundo para a impressão */
            .print\:bg-transparent {
                background-color: transparent !important;
            }

            /* ── Layout de duas colunas compacto para print ── */
            .cv-two-col {
                gap: 1.5rem !important;
            }

            /* Condensar espaçamento interno da página */
            .cv-content-area {
                padding: 0 8mm !important;
            }

            /* Condensar o header */
            header.border-b-2 {
                padding-bottom: 0.75rem !important;
                margin-bottom: 1rem !important;
            }

            /* Condensar gaps das seções */
            .cv-two-col .space-y-6 > * + * {
                margin-top: 0.75rem !important;
            }

            .cv-two-col .space-y-8 > * + * {
                margin-top: 1rem !important;
            }

            /* Seções full-width com espaçamento compacto */
            .cv-full-width {
                padding: 0 8mm !important;
            }

            .cv-full-width .space-y-6 > * + * {
                margin-top: 0.75rem !important;
            }

            .cv-full-width .space-y-4 > * + * {
                margin-top: 0.5rem !important;
            }

            /* Seções de experiência/formação: evitar quebra de cada card */
            .cv-full-width .evitar-quebra {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Reduzir padding dos cards de projetos para print */
            .bg-slate-800\/50 {
                padding: 0.5rem 0.75rem !important;
            }

            /* Experiência full-width com colunas no print */
            .cv-exp-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 0.75rem 1.5rem !important;
            }

            /* Formação em grid horizontal no print */
            .cv-edu-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr 1fr !important;
                gap: 0.5rem 1rem !important;
            }
        }

        /* ======== TEMA WHITE ======== */

        html.tema-white,
        body.tema-white {
            background-color: #ffffff !important;
        }

        body.tema-white .bg-slate-800 {
            background-color: #ffffff !important;
        }

        body.tema-white,
        body.tema-white .text-slate-300,
        body.tema-white .text-slate-400 {
            color: #334155 !important;
        }

        body.tema-white h1,
        body.tema-white h2,
        body.tema-white h3 {
            color: #0f172a !important;
        }

        body.tema-white .text-emerald-400,
        body.tema-white .text-emerald-500 {
            color: #059669 !important;
        }

        body.tema-white .border-slate-700 {
            border-color: #cbd5e1 !important;
        }

        body.tema-white .bg-slate-800\/50 {
            background-color: #f8fafc !important;
            border-color: #e2e8f0 !important;
        }

        body.tema-white .bg-slate-700 {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
            border: 1px solid #cbd5e1 !important;
        }

        body.tema-white .bg-emerald-500\/10 {
            background-color: #d1fae5 !important;
            color: #047857 !important;
        }

        body.tema-white .text-slate-500 {
            color: #64748b !important;
        }

        /* ======================================== */

        /* Estilo da Tela (Navegador) */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #10b981;
            border-radius: 4px;
        }

        /* ── Novo layout: Grid de duas colunas com escopo limitado ── */
        .cv-two-col {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        @media (min-width: 768px) {
            .cv-two-col {
                flex-direction: row;
                gap: 2.5rem;
            }

            .cv-col-main {
                width: 66.666%;
            }

            .cv-col-sidebar {
                width: 33.333%;
            }
        }

        /* Print forçado para duas colunas */
        @media print {
            .cv-two-col {
                flex-direction: row !important;
                gap: 1.5rem !important;
            }

            .cv-col-main {
                width: 63% !important;
            }

            .cv-col-sidebar {
                width: 37% !important;
            }
        }

        /* Separador sutil entre a zona two-col e full-width */
        .cv-section-divider {
            border-top: 1px solid rgba(100, 116, 139, 0.2);
            margin-top: 1.5rem;
            padding-top: 1.5rem;
        }

        @media print {
            .cv-section-divider {
                margin-top: 1rem;
                padding-top: 1rem;
            }
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-300 font-sans p-4 md:p-8">

    <div
        class="fixed top-0 left-0 w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-700 p-4 z-50 print:hidden shadow-lg">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">

            <div class="flex flex-wrap justify-center items-center gap-2">

                <div class="flex items-center gap-2 border-r border-slate-700 pr-4 mr-2">
                    <button onclick="mudarIdioma('cv-ptbr.yaml', 'pt')"
                        class="btn-tema bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1.5 rounded text-sm transition font-bold"
                        title="Português do Brasil">
                        BR PT
                    </button>
                    <button onclick="mudarIdioma('cv.yaml', 'en')"
                        class="btn-tema bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 px-3 py-1.5 rounded text-sm transition font-bold"
                        title="English">
                        US EN
                    </button>
                </div>

                <span class="text-slate-400 text-xs font-mono uppercase tracking-wider mr-2">Temas:</span>

                <button onclick="mudarTema('padrao')"
                    class="btn-tema bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-slate-600 px-3 py-1.5 rounded text-sm transition">
                    >_ Terminal
                </button>

                <button onclick="mudarTema('tema-white')"
                    class="btn-tema bg-slate-100 hover:bg-white text-slate-800 border border-slate-300 px-3 py-1.5 rounded text-sm transition">
                    📄 White
                </button>

                <button onclick="mudarTema('tema-executivo')"
                    class="btn-tema bg-[#c8c8c8] hover:bg-[#dcdcdc] text-slate-900 border border-gray-400 px-3 py-1.5 rounded text-sm transition font-serif">
                    👔 Executivo
                </button>

                <button onclick="mudarTema('tema-criativo')"
                    class="btn-tema bg-blue-100 hover:bg-blue-50 text-blue-900 border border-blue-200 px-3 py-1.5 rounded text-sm transition font-sans">
                    🎨 Criativo
                </button>

                <button onclick="mudarTema('tema-minimalista')"
                    class="btn-tema bg-white hover:bg-gray-50 text-gray-500 border border-gray-200 px-3 py-1.5 rounded text-sm transition font-sans tracking-tight">
                    🔹 Minimal
                </button>
            </div>

            <button onclick="window.print()"
                class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2 rounded shadow-lg transform hover:scale-105 transition flex items-center gap-2">
                <span>🖨️</span> Imprimir PDF
            </button>

        </div>
    </div>

    <div class="h-24 print:hidden"></div>

    <div
        class="max-w-4xl mx-auto bg-slate-800 shadow-2xl rounded-lg print:bg-transparent print:shadow-none print:max-w-full print:rounded-none">

        <table class="w-full border-collapse">

            <thead class="hidden print-header">
                <tr>
                    <td style="height: 15mm; border: none; padding: 0;"></td>
                </tr>
            </thead>

            <tbody class="print:table-row-group">
                <tr>
                    <td class="p-8 md:p-12 print:p-0 print:px-[10mm] align-top border-none cv-content-area">

                        <!-- ═══ HEADER: Full-Width ═══ -->
                        <header class="border-b-2 border-emerald-500 pb-6 mb-8 evitar-quebra">
                            <div
                                class="flex flex-col md:flex-row print:flex-row justify-between items-start md:items-center print:items-center gap-4">
                                <div>
                                    <h1 id="nome" class="text-4xl font-extrabold text-white tracking-tight mb-2">>_
                                        Carregando...</h1>
                                    <div class="flex items-center gap-3">
                                        <p id="label" class="text-emerald-400 font-mono text-sm"></p>
                                        <span
                                            class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded border border-slate-600">PcD</span>
                                    </div>
                                </div>
                                <div class="text-left md:text-right print:text-right text-sm font-mono space-y-1">
                                    <p id="email" class="text-slate-400"></p>
                                    <p id="telefone" class="text-slate-400"></p>
                                    <a id="linkedin" href="#" target="_blank"
                                        class="block text-emerald-500 hover:text-emerald-400 underline decoration-emerald-500/30 underline-offset-2"></a>
                                    <a id="github" href="#" target="_blank"
                                        class="block text-emerald-500 hover:text-emerald-400 underline decoration-emerald-500/30 underline-offset-2"></a>
                                </div>
                            </div>
                            <p id="resumo" class="mt-6 text-slate-300 leading-relaxed max-w-3xl"></p>
                        </header>

                        <!-- ═══ ZONA TWO-COL: Projetos (esquerda) + Sidebar (direita) ═══ -->
                        <div class="cv-two-col w-full">

                            <!-- Coluna Principal: APENAS Projetos -->
                            <div class="cv-col-main space-y-6">
                                <section>
                                    <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2"><span
                                            class="text-emerald-500">#</span> <span id="lbl-projetos">Projects</span>
                                    </h2>
                                    <div id="projetos-container" class="space-y-6"></div>
                                </section>
                            </div>

                            <!-- Coluna Sidebar: Competências + Idiomas + Otimização -->
                            <div class="cv-col-sidebar md:w-1/3 print:w-1/3 space-y-8">
                                <section class="evitar-quebra">
                                    <h2 id="lbl-competencias"
                                        class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">
                                        Competencies</h2>
                                    <div id="skills-container" class="space-y-4"></div>
                                </section>

                                <section class="evitar-quebra">
                                    <h2 id="lbl-idiomas"
                                        class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">
                                        Languages</h2>
                                    <ul id="idiomas-container" class="space-y-2 text-sm"></ul>
                                </section>

                                <section class="evitar-quebra">
                                    <h2 id="lbl-otimizacao"
                                        class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2">
                                        Continuous Optimization</h2>
                                    <ul id="interesses-container"
                                        class="space-y-3 text-sm text-slate-400 list-disc list-inside"></ul>
                                </section>
                            </div>

                        </div>

                        <!-- ═══ ZONA FULL-WIDTH: Experiência + Formação ═══ -->
                        <div class="cv-full-width cv-section-divider">

                            <section class="mb-6">
                                <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2"><span
                                        class="text-emerald-500">#</span> <span
                                        id="lbl-experiencia">Experience</span></h2>
                                <div id="experiencia-container" class="space-y-6 cv-exp-grid"></div>
                            </section>

                            <section>
                                <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-2"><span
                                        class="text-emerald-500">#</span> <span id="lbl-formacao">Education</span>
                                </h2>
                                <div id="formacao-container" class="space-y-4 cv-edu-grid"></div>
                            </section>

                        </div>

                    </td>
                </tr>
            </tbody>

            <tfoot class="hidden print-footer">
                <tr>
                    <td style="height: 15mm; border: none; padding: 0;"></td>
                </tr>
            </tfoot>

        </table>
    </div>

    <script>
        // Dicionário de Internacionalização
        const dicionario = {
            'pt': {
                projetos: "Projetos",
                experiencia: "Experiência",
                formacao: "Formação Acadêmica",
                competencias: "Competências",
                idiomas: "Idiomas",
                otimizacao: "Otimização Contínua",
                since: "Desde",
                expected: "Conclusão:",
                verProjeto: "[Ver Projeto]"
            },
            'en': {
                projetos: "Projects",
                experiencia: "Experience",
                formacao: "Education",
                competencias: "Competencies",
                idiomas: "Languages",
                otimizacao: "Continuous Optimization",
                since: "Since",
                expected: "Expected:",
                verProjeto: "[View Project]"
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const userFile = urlParams.get('cv');
        const arquivoAlvoInicial = userFile ? `users/${userFile}.yaml` : 'cv.yaml';
        const idiomaInicial = 'en';

        // Função Blindada para trocar os títulos do HTML
        function atualizarTitulosHTML(ui) {
            const ids = {
                'lbl-projetos': ui.projetos,
                'lbl-experiencia': ui.experiencia,
                'lbl-formacao': ui.formacao,
                'lbl-competencias': ui.competencias,
                'lbl-idiomas': ui.idiomas,
                'lbl-otimizacao': ui.otimizacao
            };
            for (const [id, texto] of Object.entries(ids)) {
                const el = document.getElementById(id);
                if (el) el.innerText = texto; // Só altera se o ID existir na tela (evita crash)
            }
        }

        function carregarCurriculo(arquivoYaml, lang) {
            const ui = dicionario[lang];
            atualizarTitulosHTML(ui);

            fetch(arquivoYaml)
                .then(response => {
                    if (!response.ok) throw new Error("Erro ao carregar: " + arquivoYaml);
                    return response.text();
                })
                .then(yamlText => {
                    const dados = jsyaml.load(yamlText);

                    document.getElementById('nome').innerText = dados.basics.name;
                    document.getElementById('label').innerText = dados.basics.label;
                    document.getElementById('email').innerText = dados.basics.email;
                    document.getElementById('telefone').innerText = dados.basics.phone;

                    const linkedinEl = document.getElementById('linkedin');
                    linkedinEl.innerText = dados.basics.url.replace('https://www.', '');
                    linkedinEl.href = dados.basics.url;

                    if (dados.basics.profiles && dados.basics.profiles.length > 0) {
                        const githubData = dados.basics.profiles.find(p => p.network === 'GitHub');
                        if (githubData) {
                            const githubEl = document.getElementById('github');
                            githubEl.innerText = githubData.url.replace('https://', '');
                            githubEl.href = githubData.url;
                        }
                    }

                    document.getElementById('resumo').innerText = dados.basics.summary;

                    const projetosContainer = document.getElementById('projetos-container');
                    const expContainer = document.getElementById('experiencia-container');
                    const formacaoContainer = document.getElementById('formacao-container');
                    const skillsContainer = document.getElementById('skills-container');
                    const idiomasContainer = document.getElementById('idiomas-container');
                    const intContainer = document.getElementById('interesses-container');

                    projetosContainer.innerHTML = '';
                    expContainer.innerHTML = '';
                    formacaoContainer.innerHTML = '';
                    skillsContainer.innerHTML = '';
                    idiomasContainer.innerHTML = '';
                    intContainer.innerHTML = '';

                    dados.projects.forEach(projeto => {
                        let bullets = projeto.highlights ? projeto.highlights.map(h => `<li class="ml-4">${h}</li>`).join('') : '';
                        let urlLink = projeto.url ? `<a href="${projeto.url}" target="_blank" class="text-emerald-500 text-sm hover:underline mt-2 inline-block">${ui.verProjeto}</a>` : '';

                        projetosContainer.innerHTML += `
                            <div class="evitar-quebra bg-slate-800/50 p-4 rounded border border-slate-700 hover:border-emerald-500/50 transition">
                                <h3 class="text-lg font-bold text-emerald-400">${projeto.name}</h3>
                                <p class="text-sm text-slate-400 mt-2 mb-2">${projeto.description}</p>
                                <ul class="text-sm text-slate-300 list-disc space-y-1">${bullets}</ul>
                                ${urlLink}
                            </div>
                        `;
                    });

                    dados.work.forEach(trabalho => {
                        expContainer.innerHTML += `
                            <div class="evitar-quebra border-l-2 border-slate-700 pl-4 pb-2">
                                <h3 class="text-lg font-bold text-white">${trabalho.position}</h3>
                                <p class="text-xs font-mono text-emerald-500 mb-2">${trabalho.name} | ${ui.since} ${trabalho.startDate.substring(0, 4)}</p>
                                <p class="text-sm text-slate-400 leading-relaxed">${trabalho.summary}</p>
                            </div>
                        `;
                    });

                    dados.education.forEach(edu => {
                        formacaoContainer.innerHTML += `
                            <div class="evitar-quebra mb-4">
                                <h3 class="font-bold text-white">${edu.area} <span class="text-slate-500 font-normal">(${edu.studyType})</span></h3>
                                <p class="text-sm text-emerald-400">${edu.institution}</p>
                                <p class="text-xs text-slate-500">${ui.expected} ${edu.endDate.substring(0, 4)}</p>
                            </div>
                        `;
                    });

                    dados.skills.forEach(skill => {
                        let tags = skill.keywords.map(k => `<span class="inline-block bg-slate-700 text-slate-300 text-xs px-2 py-1 rounded m-0.5">${k}</span>`).join('');
                        skillsContainer.innerHTML += `
                            <div class="evitar-quebra mb-3">
                                <h4 class="text-sm font-semibold text-emerald-400 mb-1">${skill.name}</h4>
                                <div class="flex flex-wrap">${tags}</div>
                            </div>
                        `;
                    });

                    dados.languages.forEach(idioma => {
                        idiomasContainer.innerHTML += `
                            <li class="flex justify-between items-center">
                                <span class="text-slate-300">${idioma.language}</span>
                                <span class="text-emerald-500 text-xs bg-emerald-500/10 px-2 py-1 rounded">${idioma.fluency}</span>
                            </li>
                        `;
                    });

                    dados.interests[0].keywords.forEach(interesse => {
                        intContainer.innerHTML += `<li>${interesse}</li>`;
                    });

                })
                .catch(error => {
                    console.error("Erro", error);
                    document.getElementById('resumo').innerText = "Erro ao carregar o arquivo YAML.";
                });
        }

        // === CONTROLES DA PÁGINA ===

        // 1. Inicia o site
        carregarCurriculo(arquivoAlvoInicial, idiomaInicial);

        // 2. Controla o botão de trocar idioma
        function mudarIdioma(nomeDoArquivo, lang) {
            carregarCurriculo(nomeDoArquivo, lang);
        }

        // 3. Controla os botões de trocar tema
        const temas = ['tema-white', 'tema-executivo', 'tema-criativo', 'tema-minimalista'];
        function mudarTema(temaSelecionado) {
            const html = document.documentElement;
            const body = document.body;

            // Limpa todos os temas
            temas.forEach(tema => {
                html.classList.remove(tema);
                body.classList.remove(tema);
            });

            // Se não for o padrão, adiciona a classe
            if (temaSelecionado !== 'padrao') {
                html.classList.add(temaSelecionado);
                body.classList.add(temaSelecionado);
            }
        }
    </script>
</body>

</html>
