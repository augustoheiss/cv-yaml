<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currículo - Augusto Heiss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <style>
        @media print {
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                background-color: white !important;
            }
            @page { 
                size: A4; 
                margin: 0; 
            }
            .shadow-2xl { box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-gray-200 text-gray-800 font-sans p-4 md:p-10">

    <div class="max-w-4xl mx-auto flex justify-end mb-4 print:hidden">
        <button onclick="window.print()" class="bg-slate-800 text-white font-bold px-4 py-2 rounded shadow hover:bg-slate-700 transition flex items-center gap-2">
            <span>📄</span> Exportar para PDF
        </button>
    </div>

    <div class="max-w-4xl mx-auto bg-white shadow-2xl rounded-lg flex flex-col md:flex-row min-h-[1050px]">
        
        <div class="bg-slate-800 text-white w-full md:w-1/3 p-8">
            <h1 id="nome" class="text-3xl font-bold mb-2 leading-tight">Carregando...</h1>
            <p id="label" class="text-slate-400 text-sm font-semibold mb-8"></p>
            <p class="text-xs text-slate-500 mb-8 border border-slate-600 rounded px-2 py-1 inline-block">PcD</p>

            <h2 class="text-lg font-bold border-b border-slate-600 pb-2 mb-4">Contato</h2>
            <ul class="text-sm space-y-4 mb-8">
                <li class="flex items-center gap-2">
                    <span>📧</span> <span id="email" class="break-all"></span>
                </li>
                <li class="flex items-center gap-2">
                    <span>📱</span> <span id="telefone"></span>
                </li>
                <li class="flex items-center gap-2">
                    <span>🌐</span> <a id="linkedin" href="#" target="_blank" class="hover:text-blue-400 break-all"></a>
                </li>
            </ul>
        </div>

        <div class="w-full md:w-2/3 p-8">
            <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-slate-200 pb-2 mb-4">Objetivo</h2>
            <p id="resumo" class="text-gray-600 mb-8 leading-relaxed">Carregando dados do YAML...</p>

            <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-slate-200 pb-2 mb-4">Projetos Pessoais</h2>
            <div id="projetos-container" class="mb-8 space-y-4"></div>

            <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-slate-200 pb-2 mb-4">Experiência Profissional</h2>
            <div id="experiencia-container" class="mb-8 space-y-4"></div>
        </div>

    </div>

    <script>
        fetch('cv.yaml')
            .then(response => response.text())
            .then(yamlText => {
                const dados = jsyaml.load(yamlText);

                document.getElementById('nome').innerText = dados.basics.name;
                document.getElementById('label').innerText = dados.basics.label;
                document.getElementById('email').innerText = dados.basics.email;
                document.getElementById('telefone').innerText = dados.basics.phone;
                
                const linkedinEl = document.getElementById('linkedin');
                linkedinEl.innerText = dados.basics.url.replace('https://www.', '');
                linkedinEl.href = dados.basics.url;

                document.getElementById('resumo').innerText = dados.basics.summary;

                const projetosContainer = document.getElementById('projetos-container');
                dados.projects.forEach(projeto => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <h3 class="text-xl font-bold text-slate-700">${projeto.name}</h3>
                        <p class="text-gray-600 mt-1 leading-relaxed">${projeto.description}</p>
                    `;
                    projetosContainer.appendChild(div);
                });

                const expContainer = document.getElementById('experiencia-container');
                dados.work.forEach(trabalho => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <h3 class="text-xl font-bold text-slate-700">${trabalho.position}</h3>
                        <p class="text-sm font-semibold text-slate-500">${trabalho.name} | Desde ${trabalho.startDate.substring(0,4)}</p>
                        <p class="text-gray-600 mt-2 leading-relaxed">${trabalho.summary}</p>
                    `;
                    expContainer.appendChild(div);
                });
            })
            .catch(error => {
                console.error("Erro ao carregar o YAML: ", error);
                document.getElementById('resumo').innerText = "Erro ao processar o arquivo cv.yaml. Verifique a formatação.";
            });
    </script>
</body>
</html>
