projects:
  - name: "Plano Escola Modelo (Automação RAG/Python)"
    description: "Sistema focado em dinamizar a burocracia escolar. O objetivo é 'matar' o trabalho estático (como grupos de WhatsApp lotados de avisos) e dar vida aos dados."
    highlights:
      - "Desenvolvimento de script funcional para cruzar dados de chamadas, calendário e tarefas de alunos/professores."
      - "A máquina (IA) assume os avisos operacionais, permitindo que a comunicação humana seja direcionada de forma cirúrgica e pessoal."
  - name: "LogicDefense (Godot Engine)"
    description: "Protótipo de jogo Web desenvolvido para tangibilizar o aprendizado mecânico e lógico. Uma representação de como a Lógica lida com o caos e o 'Tempo' determinado do sistema."
    highlights:
      - "Desenvolvido baseando-se no princípio de conexões emocionais para o aprendizado, inspirado na eficiência das LLMs."
      - "Demonstração prática de sistemas vetoriais e lógicos operando sob restrições estritas."
    url: "https://augustoheiss.github.io/LogicDefense/"
  - name: "Organização Territorial"
    description: "Aplicação em Python para otimizar a gestão de mais de 60 territórios cobertos presencialmente."
    highlights:
      - "Estruturação de regras lógicas para evitar repetições indevidas, melhorando a visualização e controle de dados."

